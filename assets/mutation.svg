<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Keeping an index true through mutation, at one read per index per change"><title>Keeping an index true through mutation, at one read per index per change</title><style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }</style><rect x="0.5" y="0.5" width="759" height="449" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/><text x="16" y="24" fill="#1a1d23" font-size="14" font-weight="700">Keeping an index true through mutation, at one read per index per change</text><text x="16" y="42" fill="#4a515b" font-size="11">Field reads for the whole workload as mutations between queries rise. There is no invalidate-and-rebuild</text><text x="16" y="57" fill="#4a515b" font-size="11">here, because the harness measured what that costs, and no lower bound to reach for either: at m = 16 the</text><text x="16" y="72" fill="#4a515b" font-size="11">eager arm pays 11,400, which is exactly what the offline optimum pays.</text><line x1="84" y1="319.49560528848065" x2="740" y2="319.49560528848065" stroke="#eceef1" stroke-width="1"/><text x="76" y="323.49560528848065" fill="#4a515b" font-size="10" text-anchor="end">10k</text><line x1="84" y1="261.4398583585902" x2="740" y2="261.4398583585902" stroke="#eceef1" stroke-width="1"/><text x="76" y="265.4398583585902" fill="#4a515b" font-size="10" text-anchor="end">100k</text><line x1="84" y1="203.3841114286997" x2="740" y2="203.3841114286997" stroke="#eceef1" stroke-width="1"/><text x="76" y="207.3841114286997" fill="#4a515b" font-size="10" text-anchor="end">1.0M</text><line x1="84" y1="145.32836449880924" x2="740" y2="145.32836449880924" stroke="#eceef1" stroke-width="1"/><text x="76" y="149.32836449880924" fill="#4a515b" font-size="10" text-anchor="end">10M</text><text x="16" y="107" fill="#4a515b" font-size="10">field reads (log scale)</text><rect x="91" y="336.97212653505477" width="27" height="29.02787346494523" rx="2" fill="#14508f"/><text x="104.5" y="331.97212653505477" fill="#4a515b" font-size="9.5" text-anchor="middle">5.0k</text><rect x="121" y="319.49560528848065" width="27" height="46.50439471151935" rx="2" fill="#2b6cb0"/><text x="134.5" y="314.49560528848065" fill="#4a515b" font-size="9.5" text-anchor="middle">10k</text><rect x="151" y="257.206297966743" width="27" height="108.79370203325698" rx="2" fill="#0f6161"/><text x="164.5" y="252.20629796674302" fill="#4a515b" font-size="9.5" text-anchor="middle">118k</text><rect x="181" y="257.206297966743" width="27" height="108.79370203325698" rx="2" fill="#a82d18"/><text x="194.5" y="252.20629796674302" fill="#4a515b" font-size="9.5" text-anchor="middle">118k</text><rect x="211" y="203.3841114286997" width="27" height="162.6158885713003" rx="2" fill="#8a5000"/><text x="224.5" y="198.3841114286997" fill="#4a515b" font-size="9.5" text-anchor="middle">1.0M</text><text x="166" y="383" fill="#1a1d23" font-size="11" text-anchor="middle">m = 0</text><rect x="255" y="335.03168544505786" width="27" height="30.96831455494214" rx="2" fill="#14508f"/><text x="268.5" y="330.03168544505786" fill="#4a515b" font-size="9.5" text-anchor="middle">5.4k</text><rect x="285" y="318.51157122877976" width="27" height="47.48842877122024" rx="2" fill="#2b6cb0"/><text x="298.5" y="313.51157122877976" fill="#4a515b" font-size="9.5" text-anchor="middle">10k</text><rect x="315" y="254.998194866732" width="27" height="111.001805133268" rx="2" fill="#0f6161"/><text x="328.5" y="249.998194866732" fill="#4a515b" font-size="9.5" text-anchor="middle">129k</text><rect x="345" y="125.45003444738026" width="27" height="240.54996555261974" rx="2" fill="#a82d18"/><text x="358.5" y="120.45003444738026" fill="#4a515b" font-size="9.5" text-anchor="middle">22M</text><rect x="375" y="203.3841114286997" width="27" height="162.6158885713003" rx="2" fill="#8a5000"/><text x="388.5" y="198.3841114286997" fill="#4a515b" font-size="9.5" text-anchor="middle">1.0M</text><text x="330" y="383" fill="#1a1d23" font-size="11" text-anchor="middle">m = 1</text><rect x="419" y="329.9721168986259" width="27" height="36.02788310137407" rx="2" fill="#14508f"/><text x="432.5" y="324.9721168986259" fill="#4a515b" font-size="9.5" text-anchor="middle">6.6k</text><rect x="449" y="315.77084305332824" width="27" height="50.229156946671765" rx="2" fill="#2b6cb0"/><text x="462.5" y="310.77084305332824" fill="#4a515b" font-size="9.5" text-anchor="middle">12k</text><rect x="479" y="249.35721327662264" width="27" height="116.64278672337736" rx="2" fill="#0f6161"/><text x="492.5" y="244.35721327662264" fill="#4a515b" font-size="9.5" text-anchor="middle">161k</text><rect x="509" y="125.4562368470817" width="27" height="240.5437631529183" rx="2" fill="#a82d18"/><text x="522.5" y="120.4562368470817" fill="#4a515b" font-size="9.5" text-anchor="middle">22M</text><rect x="539" y="203.3841114286997" width="27" height="162.6158885713003" rx="2" fill="#8a5000"/><text x="552.5" y="198.3841114286997" fill="#4a515b" font-size="9.5" text-anchor="middle">1.0M</text><text x="494" y="383" fill="#1a1d23" font-size="11" text-anchor="middle">m = 4</text><rect x="583" y="316.1919516402073" width="27" height="49.80804835979268" rx="2" fill="#14508f"/><text x="596.5" y="311.1919516402073" fill="#4a515b" font-size="9.5" text-anchor="middle">11k</text><rect x="613" y="307.07192994050916" width="27" height="58.928070059490835" rx="2" fill="#2b6cb0"/><text x="626.5" y="302.07192994050916" fill="#4a515b" font-size="9.5" text-anchor="middle">16k</text><rect x="643" y="234.4746090586734" width="27" height="131.5253909413266" rx="2" fill="#0f6161"/><text x="656.5" y="229.4746090586734" fill="#4a515b" font-size="9.5" text-anchor="middle">291k</text><rect x="673" y="125.47051355048879" width="27" height="240.5294864495112" rx="2" fill="#a82d18"/><text x="686.5" y="120.47051355048879" fill="#4a515b" font-size="9.5" text-anchor="middle">22M</text><rect x="703" y="203.3841114